name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build STorrent.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name STorrent --icon storrent.ico
          --add-data "storrent.ico;." --add-data "storrent.png;." --collect-all libtorrent storrent.py
      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process dist\STorrent\STorrent.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "STorrent.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Install Inno Setup
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: STorrent-Pro-Setup
          path: Output/*.exe
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path storrent.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: STorrent Pro ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: Output/*.exe
